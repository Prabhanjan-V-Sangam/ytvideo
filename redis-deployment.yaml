apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-config-volume
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf # Mount the specific file from the ConfigMap
          command: ["redis-server", "/usr/local/etc/redis/redis.conf"] # Start Redis with custom config
      volumes:
        - name: redis-config-volume
          configMap:
            name: redis-config # Name of the ConfigMap
            items:
              - key: redis.conf
                path: redis.conf # The file to mount from the ConfigMap
