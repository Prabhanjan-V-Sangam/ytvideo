# Max memory usage (adjust based on your system)
maxmemory 1gb  # Increased for video caching

# Eviction policy: prioritize recently accessed HLS segments
maxmemory-policy allkeys-lfu  # Least-Frequently-Used for better caching

# Save snapshots of Redis DB to disk every 10 minutes if at least 100 changes are made
save 600 100

# Disable RDB persistence if you don’t want disk persistence (optional)
# save ""

# Append-only file (AOF) for durability (optional)
appendonly yes
appendfsync everysec

# Set timeout for idle connections
timeout 300

# Enable TCP keepalive
tcp-keepalive 60

# Set a password for security (optional, but recommended)
requirepass my_secure_password

# Enable Large Object Storage (HLS segments)
hash-max-ziplist-entries 1024
hash-max-ziplist-value 4096

# Optimize for HLS
lazyfree-lazy-eviction yes  # Async delete for large segments
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
