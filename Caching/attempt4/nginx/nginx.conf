# nginx/nginx.conf
worker_processes 1;

events { worker_connections 1024; }

http {
    lua_shared_dict redis_cache 10m;

    lua_package_path "/etc/nginx/lua/?.lua;;";

    server {
        listen 80;

        location /video {
            content_by_lua_file /etc/nginx/lua/cache_logic.lua;
        }
    }
}
