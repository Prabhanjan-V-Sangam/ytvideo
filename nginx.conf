worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    proxy_cache_path /var/cache/nginx/video_cache levels=1:2 keys_zone=video_cache:10m inactive=30s max_size=5g;

    server {
        listen 8081;
        server_name localhost;

        location /videos/ {
            proxy_pass http://192.168.1.8:8080/;
            proxy_cache video_cache;

            # Always fetch the first request from the upstream (NO DELAY)
            proxy_cache_bypass 1;
            
            # Serve cached content while new content is cached in background
            proxy_cache_background_update on;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            

            # Cache the video only after the first request is made
            proxy_cache_valid 200 1m;

            add_header X-Cache-Status $upstream_cache_status;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
